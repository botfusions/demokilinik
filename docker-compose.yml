services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: klinik_crm
      # Saatsiz gelen randevu zamanları (ajan "14:00" yazar) Türkiye saati
      # olarak yorumlanmalı; varsayılan UTC olsaydı panelde 17:00 görünürdü.
      TZ: ${TZ:-Europe/Istanbul}
      PGTZ: ${TZ:-Europe/Istanbul}
    ports:
      # 5432 makinede başka bir postgres tarafından kullanılıyordu
      - "127.0.0.1:5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # openwa kendi veritabanını ilk açılışta oluşturur
      - ./scripts/init-openwa-db.sql:/docker-entrypoint-initdb.d/10-openwa.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  openwa:
    image: ghcr.io/rmyndharis/openwa:latest
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 2785
      NODE_ENV: production
      AUTO_START_SESSIONS: "true"

      # whatsapp-web.js: Chromium kullanır, ~400MB RAM, ban riski baileys'ten düşük
      # VPS'te (x86 Linux) whatsapp-web.js kalsın — ban riski baileys'ten düşük.
      # Yerel makinede Chromium açılmıyorsa .env'de ENGINE_TYPE=baileys yap.
      ENGINE_TYPE: ${ENGINE_TYPE:-whatsapp-web.js}
      PUPPETEER_HEADLESS: "true"
      PUPPETEER_ARGS: --no-sandbox,--disable-setuid-sandbox,--disable-dev-shm-usage,--disable-gpu,--no-zygote,--disable-software-rasterizer,--disable-extensions
      SESSION_DATA_PATH: /app/data/sessions

      DATABASE_TYPE: postgres
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_USERNAME: ${POSTGRES_USER}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_NAME: openwa
      # Postgres'te synchronize yasak: migration'ın kurduğu body_ts sütununu düşürür
      # ve /search her restartta 501 döner. Şemayı OpenWA migration'ları yönetir.
      DATABASE_SYNCHRONIZE: "false"

      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/data/media
      API_MASTER_KEY: ${OPENWA_API_KEY}
      # Olmazsa API anahtarları düz SHA-256 ile saklanır
      API_KEY_PEPPER: ${OPENWA_API_KEY_PEPPER}

      # Ban riskini düşüren guardrail'ler — kapatma
      RATE_LIMIT_ENABLED: "true"
      SIMULATE_TYPING: "true"

      # Webhook hedefimiz konteyner dışındaki köprü; SSRF koruması varsayılan
      # olarak iç adresleri engelliyor. Genel koruma açık kalır, yalnız bu host geçer.
      SSRF_ALLOWED_HOSTS: ${KOPRU_HOST:-host.docker.internal}

      # Chromium ilk açılışta 60s'e sığmıyor (özellikle macOS/Docker Desktop'ta)
      WWEBJS_AUTH_TIMEOUT_MS: "180000"
    ports:
      # Yalnız localhost. VPS'te dışarıya açılmaz, SSH tüneliyle erişilir.
      - "127.0.0.1:2785:2785"
    volumes:
      - ./openwa-data:/app/data
    shm_size: 1gb          # Chromium'un ihtiyacı; düşük olursa sekmeler çöker
    restart: unless-stopped

volumes:
  pgdata:

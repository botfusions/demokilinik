# /etc/nginx/sites-available/klinik
#
# Dışarıya YALNIZ panel açılır. OpenWA dashboard'u ve API'si localhost'ta kalır —
# oraya SSH tüneliyle erişilir:
#     ssh -L 2785:localhost:2785 klinik@sunucu
# sonra tarayıcıdan http://localhost:2785
#
# TLS:  sudo certbot --nginx -d panel.klinigin-alanadi.com

server {
    listen 80;
    server_name panel.klinigin-alanadi.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name panel.klinigin-alanadi.com;

    # certbot bu üç satırı kendisi doldurur
    # ssl_certificate     /etc/letsencrypt/live/panel.klinigin-alanadi.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/panel.klinigin-alanadi.com/privkey.pem;

    # Hasta verisi var; arama motorlarına düşmesin
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Webhook'u OpenWA aynı makineden çağırıyor; dışarıdan erişime kapalı.
    location /webhook/ {
        deny all;
    }

    # İç API yalnız ajan içindir, o da localhost'tan çağırır.
    location /api/ {
        deny all;
    }
}

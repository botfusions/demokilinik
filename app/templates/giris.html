<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Giriş — Klinik Paneli</title>
<style>
  body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif; background:#f6f8fa; color:#1c2430;
         display:flex; align-items:center; justify-content:center; min-height:100vh; }
  form { background:#fff; border:1px solid #dfe3e8; border-radius:10px; padding:28px; width:320px; }
  h1 { font-size:17px; margin:0 0 18px; }
  input { width:100%; padding:9px 11px; border:1px solid #dfe3e8; border-radius:6px; font:inherit; margin-bottom:14px; }
  button { width:100%; padding:9px; border:0; border-radius:6px; background:#0b6bcb; color:#fff; font:inherit; cursor:pointer; }
  .hata { background:#fdecea; color:#c0392b; padding:9px 12px; border-radius:6px; margin-bottom:14px; font-size:14px; }
</style>
</head>
<body>
<form method="post" action="/giris">
  <h1>Klinik Paneli</h1>
  {% if hata %}<div class="hata">Parola hatalı.</div>{% endif %}
  <label for="p">Parola</label>
  <input id="p" type="password" name="parola" autofocus required>
  <button>Giriş yap</button>
</form>
</body>
</html>

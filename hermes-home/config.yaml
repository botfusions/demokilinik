model:
  default: gpt-5.6-luna
  provider: openai
  reasoning_effort: medium
agent:
  # Resepsiyon işi kısa: bilgi oku, uygunluk sor, randevu yaz. 30 tur fazlasıyla
  # yeter ve kaçak bir döngünün maliyeti burada duruyor.
  max_turns: 30
  # Tool şemaları her istekte input maliyetine giriyor — ölçümde toplam prompt'un
  # %69'uydu (44,4 KB / 16 tool), hastanın mesajı ise %0,09. Randevu araçları
  # artık mcp_servers.klinik'ten geliyor, kabuk gerekmiyor.
  # Ölçmek için: hermes prompt-size
  disabled_toolsets:
    - memory          # konuşma geçmişinin tek kaynağı Postgres
    - browser
    - vision
    - computer_use    # 9,7 KB — en pahalı şema, resepsiyonistin ekranı yok
    - session_search  # 6,5 KB — Hermes oturumu kullanılmıyor
    - file            # 6,1 KB — bilgi tabanı prompt'a zaten enjekte ediliyor
    - terminal        # 4,8 KB — klinik MCP araçları geldi, kabuk yetkisi kalktı
    - delegation      # 3,9 KB — alt ajan zinciri yok, olmayacak
    - clarify         # 2,4 KB — `-z` tek atış, soru soracak kimse yok
    - code_execution
    - tts
    - todo
    - web             # anahtarsız şema üretmiyor ama ileride sızmasın
    - image_gen
    - bfl
    - cronjob         # hatırlatmaları app/hatirlatma.py planlıyor, ajan değil
terminal:
  backend: local
compression:
  enabled: true
  threshold: 0.5
memory:
  memory_enabled: false
skills:
  guard_agent_created: true
  write_approval: true
_config_version: 33
# Ajanın randevu araçları. Eskiden skill'ler `curl` yazıyordu ve bu `terminal`
# toolset'ini zorunlu kılıyordu — yani prompt'a sızacak bir talimat kabuk
# komutu çalıştırabilirdi. Artık ajanın yapabilecekleri klinik-mcp.py'deki
# 7 araçla sınırlı. Yan fayda: şemaları terminal'inkinden küçük (2,6 KB / 4,8 KB).
#
# Yollar göreli: ajan.py `cwd=PROJE_KOKU` ile çağırıyor, VPS'te yol değişince
# burada düzeltme gerekmesin.
#
# IC_API_ANAHTARI bilerek yazılmadı — bu dosya git'te takip ediliyor. Alt süreç
# ortamı Hermes'ten miras alıyor, anahtar .env'den geliyor.
mcp_servers:
  klinik:
    command: .venv/bin/python
    args:
      - scripts/klinik-mcp.py
    enabled: true

# ── Security ──────────────────────────────────────────────────────────
# Secret redaction is ON by default — strings that look like API keys,
# tokens, and passwords are masked in tool output, logs, and chat
# responses before the model or user ever sees them. Set redact_secrets
# to false to disable (e.g. when developing the redactor itself).
# tirith pre-exec scanning is enabled by default when the tirith binary
# is available. Configure via security.tirith_* keys or env vars
# (TIRITH_ENABLED, TIRITH_BIN, TIRITH_TIMEOUT, TIRITH_FAIL_OPEN).
#
# security:
#   redact_secrets: true
#   tirith_enabled: true
#   tirith_path: "tirith"
#   tirith_timeout: 5
#   tirith_fail_open: true

# ── Fallback Model ────────────────────────────────────────────────────
# Automatic provider failover when primary is unavailable.
# Uncomment and configure to enable. Triggers on rate limits (429),
# overload (529), service errors (503), or connection failures.
#
# Supported providers:
#   openrouter   (OPENROUTER_API_KEY)  — routes to any model
#   openai-codex (OAuth — hermes auth) — OpenAI Codex
#   nous         (OAuth — hermes auth) — Nous Portal
#   zai          (ZAI_API_KEY)         — Z.AI / GLM
#   kimi-coding  (KIMI_API_KEY)        — Kimi / Moonshot
#   kimi-coding-cn (KIMI_CN_API_KEY)   — Kimi / Moonshot (China)
#   minimax      (MINIMAX_API_KEY)     — MiniMax
#   minimax-cn   (MINIMAX_CN_API_KEY)  — MiniMax (China)
#   bedrock      (AWS IAM / boto3)     — AWS Bedrock (Converse API)
#
# For custom OpenAI-compatible endpoints, add base_url and key_env.
#
# fallback_model:
#   provider: openrouter
#   model: anthropic/claude-sonnet-4

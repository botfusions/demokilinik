# Klinik resepsiyonist ajanı — bu klasöre özel yapılandırma.
# HERMES_HOME=./hermes-home ile çalışır; global ~/.hermes hiç kullanılmaz.

model:
  # Provider ayrı alanda: "openai/gpt-5.6-luna" biçimi ZAI gibi başka bir
  # sağlayıcıya yönlenip "Unknown Model" hatası veriyor.
  default: "gpt-5.6-luna"
  provider: "openai"
  reasoning_effort: medium

terminal:
  backend: local

agent:
  # Resepsiyon işi kısa: bilgi oku, uygunluk sor, randevu yaz. 30 tur fazlasıyla yeter
  # ve kaçak bir döngünün maliyeti burada duruyor.
  max_turns: 30
  disabled_toolsets:
    - memory        # konuşma geçmişinin tek kaynağı Postgres
    - browser
    - vision

memory:
  memory_enabled: false

skills:
  guard_agent_created: true
  write_approval: true    # ajan kendi kendine skill yazıp davranışını değiştirmesin

compression:
  enabled: true
  threshold: 0.50

